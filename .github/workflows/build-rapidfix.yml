name: Build Perf LMI v311c (rapid_soc_dec fix)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLANG_REPO_COMMIT: b13a969798dd18ef2af4f7225fd271565e7e135f
      KERNELSU_COMMIT: 99155969e37457a8ca0fa6c17c788cc2a0b67f0c
      ANYKERNEL_BASE_SHA256: a7b9acf5e5d404df5bb88ac0848d5ccd5057b35fe13beb8d09fe6e7c5ea9a3b6
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev libncurses-dev \
            cpio python3 zip unzip curl wget git build-essential \
            binutils-aarch64-linux-gnu binutils-arm-linux-gnueabi git-lfs

      - name: Fetch AOSP clang r563880c (exact toolchain of official v311c)
        timeout-minutes: 90
        run: |
          rm -rf "$HOME/clang" "$HOME/prebuilts"
          export GIT_LFS_SKIP_SMUDGE=1
          git init "$HOME/prebuilts"
          git -C "$HOME/prebuilts" remote add origin \
            https://github.com/bluestacks/prebuilts-clang-host-linux-x86-a16
          git -C "$HOME/prebuilts" sparse-checkout init --cone
          git -C "$HOME/prebuilts" sparse-checkout set clang-r563880c
          git -C "$HOME/prebuilts" fetch --depth 1 origin "$CLANG_REPO_COMMIT"
          git -C "$HOME/prebuilts" checkout --detach FETCH_HEAD
          test "$(git -C "$HOME/prebuilts" rev-parse HEAD)" = "$CLANG_REPO_COMMIT"
          git -C "$HOME/prebuilts" lfs pull --include="clang-r563880c/**"
          mv "$HOME/prebuilts/clang-r563880c" "$HOME/clang"
          cat "$HOME/clang/AndroidVersion.txt"
          "$HOME/clang/bin/clang" --version
          "$HOME/clang/bin/clang" --version | grep -q "r563880c" || { echo "::error::clang version mismatch - expected r563880c"; exit 1; }

      - name: Set up KernelSU-Next (pinned 99155969, as in official v311c build)
        run: |
          git init KernelSU-Next
          cd KernelSU-Next
          git remote add origin https://github.com/rifsxd/KernelSU-Next.git
          git fetch --depth 1 origin "$KERNELSU_COMMIT"
          git checkout FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$KERNELSU_COMMIT"
          cd ..
          ln -s ../KernelSU-Next/kernel drivers/kernelsu
          echo "drivers/kernelsu -> $(readlink drivers/kernelsu)"
          ls drivers/kernelsu/ksu.c

      - name: Verify the fix is present in sources
        run: |
          grep -n "Exit rapid soc decrease mode" drivers/power/supply/qcom/qpnp-fg-gen4.c
          grep -n "rapid_soc_config" drivers/power/supply/qcom/qpnp-fg-gen4.c | head -5
          grep -n '_fix1' arch/arm64/configs/lmi_defconfig

      - name: Build kernel
        run: |
          export PATH="$HOME/clang/bin:$PATH"
          export LD_LIBRARY_PATH="$HOME/clang/lib64:${LD_LIBRARY_PATH:-}"
          make O=out ARCH=arm64 lmi_defconfig
          grep -qx "CONFIG_KSU=y" out/.config
          grep -qx "CONFIG_KSU_SUSFS=y" out/.config
          make -j"$(nproc)" O=out ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar NM=llvm-nm OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump \
            READELF=llvm-readelf OBJSIZE=llvm-size STRIP=llvm-strip
          test -f out/arch/arm64/boot/Image || { echo "::error::Image not built"; exit 1; }
          ls -la out/arch/arm64/boot/Image

      - name: Verify built image
        run: |
          echo "--- localversion:"
          grep -qx 'CONFIG_LOCALVERSION="-Perf_LMI_v311c_A16__KSUN_raystef66_fix1"' out/.config
          strings out/arch/arm64/boot/Image > /tmp/image.strings
          echo "--- fix marker in Image:"
          grep -F "exit rapid soc decrease" /tmp/image.strings
          echo "--- toolchain string embedded in kernel:"
          grep -m1 "based on r563880c" /tmp/image.strings

      - name: Package flashable AnyKernel3 zip
        run: |
          curl -L --retry 3 -o /tmp/orig.zip \
            "https://github.com/raystef66/kernel_xiaomi_sm8250/releases/download/v311c_A16_KSUN/Perf_LMI_v311c_A16_KSUN_raystef66.zip"
          echo "$ANYKERNEL_BASE_SHA256  /tmp/orig.zip" | sha256sum -c -
          rm -rf /tmp/ak3 && mkdir -p /tmp/ak3
          cd /tmp/ak3
          unzip -q /tmp/orig.zip
          ls -la
          rm -f Image
          cp "$GITHUB_WORKSPACE/out/arch/arm64/boot/Image" .
          zip -r9 -q "$GITHUB_WORKSPACE/Perf_LMI_v311c_A16_KSUN_raystef66_fix1.zip" .
          cd "$GITHUB_WORKSPACE"
          sha256sum Perf_LMI_v311c_A16_KSUN_raystef66_fix1.zip | tee sha256.txt
          ls -la Perf_LMI_v311c_A16_KSUN_raystef66_fix1.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Perf_LMI_v311c_A16_KSUN_raystef66_fix1
          path: |
            Perf_LMI_v311c_A16_KSUN_raystef66_fix1.zip
            sha256.txt
          retention-days: 14
          if-no-files-found: error
