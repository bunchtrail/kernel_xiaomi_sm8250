name: Compatibility report
description: Report results from testing a published build on Xiaomi lmi
title: "[Compatibility]: "
labels: []
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Use this form for Xiaomi lmi test results. Do not include private backups, partition dumps, identifiers, or secrets.

  - type: input
    id: device
    attributes:
      label: Exact device model
      description: Include marketing name, codename, and hardware revision if known.
    validations:
      required: true

  - type: input
    id: rom
    attributes:
      label: ROM and build
      description: ROM name, version, build date, and Android version.
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel release
      description: Complete output of `uname -r`.
    validations:
      required: true

  - type: input
    id: recovery
    attributes:
      label: Recovery
      description: Recovery name and version used to install the AnyKernel3 ZIP.
    validations:
      required: true

  - type: dropdown
    id: boot
    attributes:
      label: Boot result
      options:
        - Booted successfully
        - Boot failed; rollback succeeded
        - Boot failed; recovery required
    validations:
      required: true

  - type: textarea
    id: core
    attributes:
      label: Core feature checks
      description: Report KernelSU, mobile network, Wi-Fi, Bluetooth, camera, charging, and basic performance individually.
      placeholder: |
        KernelSU:
        Mobile network:
        Wi-Fi:
        Bluetooth:
        Camera:
        Charging:
        Basic performance:
    validations:
      required: true

  - type: textarea
    id: battery
    attributes:
      label: Battery SOC behavior
      description: Describe only what was actually observed, including timestamps and voltage/current values where available.
    validations:
      required: true

  - type: textarea
    id: issues
    attributes:
      label: Issues or regressions
      description: Include reproduction steps and redacted logs, or write "None observed".
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Submission checklist
      options:
        - label: I tested the published or checksummed build identified above on Xiaomi lmi.
          required: true
        - label: I removed secrets, personal data, identifiers, and private binary backups.
          required: true
